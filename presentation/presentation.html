<h1 is="marp-h1" data-auto-scaling id="photoacoustic-tomography-image-reconstruction"> Photoacoustic Tomography Image Reconstruction</h1>
<h2 id="simultaneous-reconstruction-of-light-absorption-and-sound-speed-fields-using-multiple-illumination-angles-and-learned-regularization-in-a-limited-view-setting">Simultaneous Reconstruction of Light Absorption and Sound Speed Fields Using Multiple Illumination Angles and Learned Regularization in a Limited View Setting</h2>
<h5 id="matthew-grindstaff">Matthew Grindstaff</h5>
<h2 is="marp-h2" data-auto-scaling id="a-thesis-presented-for-the-degree-of-msc-scientific-and-data-intensive-computing-at-university-college-london"> A thesis presented for the degree of MSc Scientific and Data Intensive Computing at University College London</h2>
</section>

<h1 id="photoacoustic-tomography-pat">Photoacoustic Tomography (PAT)</h1>
<ul>
<li>Primarily used in medical imaging</li>
<li>Nanosecond laser pulse illuminates tissue</li>
<li>Pressure spike due to thermoelastic expansion of light-absorbing molecules</li>
<li>Acoustic waves detected by ultrasound transducers</li>
</ul>
<p>Why?</p>
<ul>
<li>Acoustic waves scatter significantly less than light
<ul>
<li>Higher resolution at depth than optical imaging</li>
</ul>
</li>
<li>Contrast is based on optical absorption, not acoustic impedance boundaries
<ul>
<li>Outperforms ultrasound</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" lang="en-GB">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">illuminate_2d</span>(<span class="hljs-params">mu, angle, alpha</span>):
    mu_ = rotate(mu, -angle)
    mu_ = - cumsum(mu_, axis=<span class="hljs-number">0</span>)
    mu_ = rotate(mu_, angle)
    p0 = mu * exp(alpha * mu_)

    <span class="hljs-keyword">return</span> p0

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> jaxdf <span class="hljs-keyword">import</span> FourierSeries 
<span class="hljs-keyword">from</span> jwave.geometry <span class="hljs-keyword">import</span> Domain, Medium, TimeAxis, BLISensors
<span class="hljs-keyword">from</span> jwave.acoustics <span class="hljs-keyword">import</span> simulate_wave_propagation

domain = Domain(N, dx)
c = FourierSeries(c, domain)
medium = Medium(domain, c, pml_size)
P0 = FourierSeries(P0, domain)
time_axis = TimeAxis.from_medium(medium, cfl)
sensors = BLISensors(sensor_positions, domain.N)

<span class="hljs-meta">@jit</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">compiled_simulator</span>(<span class="hljs-params">medium, time_axis, p0</span>):
    <span class="hljs-keyword">return</span> simulate_wave_propagation(medium, time_axis, p0, sensors)

batch_compiled_simulator = vmap(compiled_simulator, in_axes=(<span class="hljs-literal">None</span>, <span class="hljs-literal">None</span>, <span class="hljs-number">0</span>))

P_data = batch_compiled_simulator(medium, time_axis, P0)
</code></pre>

<h1 id="reconstruction---gradient-descent">Reconstruction - Gradient Descent</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">recon_step_illum2</span>(<span class="hljs-params">mu_p, c_p, angles, P_data</span>):

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">loss_rec</span>(<span class="hljs-params">mu_p, c_p</span>):
        mu_r = get_mu(mu_p)
        c_r = get_sound_speed(c_p)

        P0 = illuminate_batch(mu_r, angles, alpha)
        
        P0 = FourierSeries(P0, domain)
        medium = Medium(domain, sound_speed=c_r, pml_size=pml_size)
        
        P_pred = batch_compiled_simulate(medium, time_axis, P0)
        
        <span class="hljs-keyword">return</span> mse(P_pred, P_data)
    
    loss_data, (d_mu_p, d_c_p) = value_and_grad(loss_rec, (<span class="hljs-number">0</span>, <span class="hljs-number">1</span>))(mu_p, c_p)
    
    <span class="hljs-keyword">return</span> loss_data, d_mu_p, d_c_p
</code></pre>
